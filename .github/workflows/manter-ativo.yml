name: Manter banco ativo

on:
  schedule:
    - cron: "17 12 */3 * *"   # a cada 3 dias, por volta das 9h (horário de Brasília)
  workflow_dispatch:          # permite rodar na mão, pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Dar um toque no banco do Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://noeqmzhyzmqhgszbrgmf.supabase.co/rest/v1/rpc/estado" \
            -H "apikey: sb_publishable_y8tEYPhzleorUl1kVESvow_9pwVt0QG" \
            -H "Content-Type: application/json" \
            -d '{"p_pin":"despertador"}')
          echo "Resposta do banco: $code"
          # 400 = o banco respondeu (PIN de teste recusado, como esperado). Qualquer resposta abaixo de 500 serve.
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "O banco não respondeu. Ele pode estar pausado: entre em supabase.com e clique em Resume project."
            exit 1
          fi

      - name: Manter o repositório ativo (uma vez por mês)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
        run: |
          dia=$(date -u +%d)
          if [ "$dia" -gt 3 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Ainda não é dia de atualizar o repositório."; exit 0
          fi
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          date -u +"%Y-%m-%d %H:%M UTC" > ultimo-toque.txt
          git config user.name "despertador"
          git config user.email "despertador@users.noreply.github.com"
          git add ultimo-toque.txt
          git commit -m "Despertador: banco ativo" || exit 0
          git push
